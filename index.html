<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>카드뉴스 생성기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0f;
    --surface: #17171a;
    --surface2: #1f1f24;
    --border: rgba(255,255,255,0.08);
    --border-hover: rgba(255,255,255,0.16);
    --text: #f0eff4;
    --text-sub: #8b8a96;
    --text-muted: #4a4955;
    --accent: #7c5cbf;
    --accent-light: rgba(124,92,191,0.15);
    --accent-border: rgba(124,92,191,0.4);
    --danger: #e05a5a;
    --success: #4caf82;
    --radius: 12px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    min-height: 100vh;
  }

  /* Layout */
  .layout { display: flex; min-height: 100vh; }
  .sidebar {
    width: 240px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 32px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }
  .main { flex: 1; padding: 32px; max-width: 900px; }

  /* Logo */
  .logo { display: flex; align-items: center; gap: 10px; padding: 0 4px; }
  .logo-mark {
    width: 32px; height: 32px; border-radius: 8px;
    background: var(--accent); display: flex; align-items: center;
    justify-content: center; font-size: 16px;
  }
  .logo-text { font-size: 15px; font-weight: 700; letter-spacing: -0.02em; }
  .logo-sub { font-size: 11px; color: var(--text-sub); margin-top: 1px; }

  /* Sidebar section */
  .sidebar-section { display: flex; flex-direction: column; gap: 6px; }
  .sidebar-label {
    font-size: 10px; color: var(--text-muted); text-transform: uppercase;
    letter-spacing: 0.1em; padding: 0 8px; margin-bottom: 2px;
  }

  /* Account buttons */
  .account-btn {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 10px; border-radius: var(--radius-sm);
    border: 1px solid transparent; cursor: pointer;
    background: transparent; color: var(--text-sub);
    font-family: inherit; font-size: 13px; text-align: left;
    transition: all 0.15s;
  }
  .account-btn:hover { background: var(--surface2); color: var(--text); }
  .account-btn.active {
    background: var(--accent-light);
    border-color: var(--accent-border);
    color: var(--text);
  }
  .account-icon { font-size: 18px; flex-shrink: 0; }
  .account-info { display: flex; flex-direction: column; gap: 1px; }
  .account-name { font-weight: 500; font-size: 13px; }
  .account-desc { font-size: 11px; color: var(--text-muted); }
  .account-btn.active .account-desc { color: var(--text-sub); }

  /* API Key */
  .api-section { margin-top: auto; }
  .api-label { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; display: flex; align-items: center; gap: 4px; }
  .api-input {
    width: 100%; padding: 8px 10px; background: var(--surface2);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    color: var(--text); font-family: monospace; font-size: 11px;
    outline: none; transition: border-color 0.15s;
  }
  .api-input:focus { border-color: var(--accent-border); }
  .api-hint { font-size: 10px; color: var(--text-muted); margin-top: 5px; line-height: 1.5; }
  .api-hint a { color: var(--accent); text-decoration: none; }

  /* Main area */
  .page-title { font-size: 22px; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 4px; }
  .page-sub { font-size: 13px; color: var(--text-sub); margin-bottom: 28px; }

  /* Form */
  .form-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px; margin-bottom: 20px;
  }
  .form-row { display: flex; gap: 12px; align-items: flex-end; }
  .form-group { display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .form-label { font-size: 11px; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.08em; }
  .form-input, .form-select {
    padding: 10px 14px; background: var(--surface2);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    color: var(--text); font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px; outline: none; transition: border-color 0.15s;
  }
  .form-input:focus, .form-select:focus { border-color: var(--accent-border); }
  .form-input::placeholder { color: var(--text-muted); }
  .form-select { cursor: pointer; }
  .form-select option { background: var(--surface2); }
  .generate-btn {
    padding: 10px 22px; background: var(--accent); color: #fff;
    border: none; border-radius: var(--radius-sm); font-family: inherit;
    font-size: 14px; font-weight: 500; cursor: pointer;
    transition: opacity 0.15s; white-space: nowrap; flex-shrink: 0;
  }
  .generate-btn:hover { opacity: 0.88; }
  .generate-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Error */
  .error-bar {
    background: rgba(224,90,90,0.1); border: 1px solid rgba(224,90,90,0.3);
    border-radius: var(--radius-sm); padding: 10px 14px;
    color: var(--danger); font-size: 13px; margin-bottom: 16px; display: none;
  }

  /* Loading */
  .loading {
    display: none; align-items: center; gap: 10px;
    padding: 24px 0; color: var(--text-sub); font-size: 13px;
  }
  .spinner {
    width: 18px; height: 18px; border-radius: 50%;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Preview */
  .preview-section { display: none; }
  .section-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }
  .section-title { font-size: 12px; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.08em; }
  .copy-all-btn {
    padding: 6px 14px; border: 1px solid var(--border-hover);
    border-radius: var(--radius-sm); background: transparent; color: var(--text-sub);
    font-family: inherit; font-size: 12px; cursor: pointer; transition: all 0.15s;
  }
  .copy-all-btn:hover { background: var(--surface2); color: var(--text); }

  /* Slides scroll */
  .slides-scroll {
    display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px;
    margin-bottom: 20px; scrollbar-width: thin; scrollbar-color: var(--border) transparent;
  }
  .slide-thumb {
    flex-shrink: 0; width: 160px; height: 160px; border-radius: 10px;
    padding: 14px; display: flex; flex-direction: column;
    justify-content: space-between; cursor: pointer;
    border: 2px solid transparent; transition: border-color 0.15s;
    position: relative;
  }
  .slide-thumb:hover { border-color: rgba(255,255,255,0.15); }
  .slide-thumb.active { border-color: var(--accent) !important; }
  .thumb-num { font-size: 10px; font-weight: 500; opacity: 0.5; }
  .thumb-title { font-size: 12px; font-weight: 500; line-height: 1.4; }
  .thumb-body { font-size: 10px; line-height: 1.4; opacity: 0.7; }
  .thumb-tag { font-size: 9px; opacity: 0.4; }

  /* Detail */
  .detail-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 24px; margin-bottom: 16px;
  }
  .detail-num { font-size: 11px; color: var(--text-muted); margin-bottom: 10px; }
  .detail-title {
    font-family: 'Noto Serif KR', serif;
    font-size: 20px; font-weight: 700; line-height: 1.5;
    margin-bottom: 12px; letter-spacing: -0.02em;
  }
  .detail-body { font-size: 14px; color: var(--text-sub); line-height: 1.8; margin-bottom: 14px; }
  .detail-tag { font-size: 12px; color: var(--accent); opacity: 0.8; }

  /* Action buttons */
  .action-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .action-btn {
    padding: 8px 16px; border: 1px solid var(--border-hover);
    border-radius: var(--radius-sm); background: transparent; color: var(--text-sub);
    font-family: inherit; font-size: 12px; cursor: pointer; transition: all 0.15s;
  }
  .action-btn:hover { background: var(--surface2); color: var(--text); border-color: var(--border-hover); }

  /* Toast */
  .toast {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--success); color: #fff;
    padding: 10px 18px; border-radius: var(--radius-sm);
    font-size: 13px; font-weight: 500;
    opacity: 0; transform: translateY(8px);
    transition: all 0.2s; pointer-events: none; z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateY(0); }

  /* Mobile */
  @media (max-width: 640px) {
    .layout { flex-direction: column; }
    .sidebar { width: 100%; height: auto; position: static; flex-direction: row; flex-wrap: wrap; padding: 16px; gap: 16px; }
    .sidebar-section { flex-direction: row; flex-wrap: wrap; }
    .account-btn { padding: 7px 10px; }
    .main { padding: 16px; }
    .form-row { flex-direction: column; }
    .api-section { width: 100%; }
  }
</style>
</head>
<body>

<div class="layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-mark">🌱</div>
      <div>
        <div class="logo-text">카드뉴스</div>
        <div class="logo-sub">생성기</div>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">계정 선택</div>
      <button class="account-btn active" onclick="selectAccount('avatarcourse')" id="btn-avatarcourse">
        <span class="account-icon">🌱</span>
        <span class="account-info">
          <span class="account-name">아봐타코스</span>
          <span class="account-desc">의식계발교육</span>
        </span>
      </button>
      <button class="account-btn" onclick="selectAccount('koreansl')" id="btn-koreansl">
        <span class="account-icon">🤟</span>
        <span class="account-info">
          <span class="account-name">한국수어</span>
          <span class="account-desc">수어 교육</span>
        </span>
      </button>
      <button class="account-btn" onclick="selectAccount('digital')" id="btn-digital">
        <span class="account-icon">💻</span>
        <span class="account-info">
          <span class="account-name">디지털교육</span>
          <span class="account-desc">디지털 리터러시</span>
        </span>
      </button>
      <button class="account-btn" onclick="selectAccount('selfdev')" id="btn-selfdev">
        <span class="account-icon">✨</span>
        <span class="account-info">
          <span class="account-name">자기계발</span>
          <span class="account-desc">좋은글·동기부여</span>
        </span>
      </button>
    </div>

    <div class="api-section">
      <div class="api-label">🔑 Anthropic API Key</div>
      <input class="api-input" type="password" id="apiKey" placeholder="sk-ant-..." />
      <div class="api-hint">
        키는 브라우저에만 저장됩니다.<br>
        <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a>에서 발급
      </div>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="page-title">카드뉴스 생성기</div>
    <div class="page-sub">주제를 입력하면 AI가 슬라이드 내용을 자동으로 만들어드려요.</div>

    <div class="form-card">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">주제</label>
          <input class="form-input" id="topicInput" placeholder="예: 9월 아봐타코스 일정 안내" />
        </div>
        <div class="form-group" style="max-width:100px">
          <label class="form-label">슬라이드 수</label>
          <select class="form-select" id="slideCount">
            <option value="3">3장</option>
            <option value="4">4장</option>
            <option value="5" selected>5장</option>
            <option value="6">6장</option>
            <option value="7">7장</option>
          </select>
        </div>
        <button class="generate-btn" id="genBtn" onclick="generate()">생성하기</button>
      </div>
    </div>

    <div class="error-bar" id="errorBar"></div>
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <span>슬라이드 내용을 생성하는 중...</span>
    </div>

    <div class="preview-section" id="previewSection">
      <div class="section-header">
        <span class="section-title" id="previewLabel">미리보기</span>
        <button class="copy-all-btn" onclick="copyAll()">전체 텍스트 복사</button>
      </div>

      <div class="slides-scroll" id="slidesScroll"></div>

      <div class="detail-card" id="detailCard"></div>

      <div class="action-row">
        <button class="action-btn" onclick="regenerate()">↺ 다시 생성</button>
        <button class="action-btn" onclick="copySlide()">현재 슬라이드 복사</button>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
const accounts = {
  avatarcourse: {
    name: '아봐타코스',
    defaultSlides: 5,
    style: { bg: '#1a1a2e', text: '#e8e0f0', sub: '#a89cc8' },
    tone: '의식계발, 아봐타 교육, 내면 성장. 철학적이고 깊은 통찰을 주는 어조. 호기심을 자극하고 묵직한 질문을 던지는 방식. 아봐타(Avatar) 교육 프로그램과 연결.'
  },
  koreansl: {
    name: '한국수어',
    defaultSlides: 4,
    style: { bg: '#0d2137', text: '#d8edf8', sub: '#6aaed4' },
    tone: '한국수어 교육 정보, 접근성, 수어의 아름다움. 친근하고 명확하며 따뜻한 교육적 어조.'
  },
  digital: {
    name: '디지털교육',
    defaultSlides: 5,
    style: { bg: '#0a1628', text: '#c8dff5', sub: '#5a9fd4' },
    tone: '디지털 교육, IT 트렌드, 미래 기술. 세련되고 정보 중심적이며 실용적인 어조.'
  },
  selfdev: {
    name: '자기계발',
    defaultSlides: 6,
    style: { bg: '#1c1408', text: '#f5e8cc', sub: '#c9a464' },
    tone: '자기계발, 동기부여, 좋은 글귀, 삶의 지혜. 따뜻하고 공감을 이끌어내는 어조. 저장하고 공유하고 싶은 문장.'
  }
};

let currentAccount = 'avatarcourse';
let slides = [];
let selectedIdx = 0;
let lastTopic = '';
let lastCount = 5;

function selectAccount(id) {
  currentAccount = id;
  document.querySelectorAll('.account-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + id).classList.add('active');
  document.getElementById('slideCount').value = accounts[id].defaultSlides;
  if (slides.length) renderPreview();
}

async function generate() {
  const apiKey = document.getElementById('apiKey').value.trim();
  const topic = document.getElementById('topicInput').value.trim();
  const count = parseInt(document.getElementById('slideCount').value);
  const errBar = document.getElementById('errorBar');
  errBar.style.display = 'none';

  if (!apiKey) { showError('API 키를 입력해주세요.'); return; }
  if (!topic) { showError('주제를 입력해주세요.'); return; }

  lastTopic = topic;
  lastCount = count;

  const btn = document.getElementById('genBtn');
  btn.disabled = true;
  btn.textContent = '생성 중...';
  document.getElementById('loading').style.display = 'flex';
  document.getElementById('previewSection').style.display = 'none';

  const acct = accounts[currentAccount];
  const prompt = `인스타그램 카드뉴스 콘텐츠를 JSON으로 생성해주세요.

계정: ${acct.name}
어조: ${acct.tone}
주제: ${topic}
슬라이드 수: ${count}장

반드시 아래 JSON 형식만 출력하세요. 마크다운 코드블록 없이 순수 JSON만:
{"slides":[{"num":1,"title":"제목(20자이내)","body":"본문(80자이내)","tag":"#해시태그1 #해시태그2 #해시태그3"}]}

구성: 1번=호기심 자극 후킹, 중간=핵심내용 전개, 마지막=감동적 마무리 또는 행동 유도`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1500,
        messages: [{ role: 'user', content: prompt }]
      })
    });

    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.error?.message || `오류 ${res.status}`);
    }

    const data = await res.json();
    const raw = data.content.filter(i => i.type === 'text').map(i => i.text).join('').trim();
    const parsed = JSON.parse(raw.replace(/```json|```/g, '').trim());
    slides = parsed.slides;
    selectedIdx = 0;
    renderPreview();
  } catch(e) {
    showError('생성 실패: ' + e.message);
  }

  btn.disabled = false;
  btn.textContent = '생성하기';
  document.getElementById('loading').style.display = 'none';
}

function regenerate() {
  generate();
}

function showError(msg) {
  const bar = document.getElementById('errorBar');
  bar.textContent = msg;
  bar.style.display = 'block';
  document.getElementById('loading').style.display = 'none';
  document.getElementById('genBtn').disabled = false;
  document.getElementById('genBtn').textContent = '생성하기';
}

function renderPreview() {
  const acct = accounts[currentAccount];
  const s = acct.style;
  document.getElementById('previewSection').style.display = 'block';
  document.getElementById('previewLabel').textContent = `미리보기 — ${acct.name}`;

  document.getElementById('slidesScroll').innerHTML = slides.map((slide, i) => `
    <div class="slide-thumb ${i === selectedIdx ? 'active' : ''}"
      style="background:${s.bg}; border-color:${i === selectedIdx ? 'var(--accent)' : 'transparent'}"
      onclick="selectSlide(${i})">
      <div class="thumb-num" style="color:${s.sub}">${String(slide.num).padStart(2,'0')} / ${slides.length}</div>
      <div>
        <div class="thumb-title" style="color:${s.text}">${slide.title}</div>
        <div class="thumb-body" style="color:${s.sub}">${slide.body}</div>
      </div>
      <div class="thumb-tag" style="color:${s.sub}">${slide.tag || ''}</div>
    </div>
  `).join('');

  renderDetail();
}

function renderDetail() {
  const sel = slides[selectedIdx];
  document.getElementById('detailCard').innerHTML = `
    <div class="detail-num">${sel.num} / ${slides.length}</div>
    <div class="detail-title">${sel.title}</div>
    <div class="detail-body">${sel.body}</div>
    <div class="detail-tag">${sel.tag || ''}</div>
  `;
}

function selectSlide(i) {
  selectedIdx = i;
  document.querySelectorAll('.slide-thumb').forEach((el, idx) => {
    el.classList.toggle('active', idx === i);
  });
  renderDetail();
}

function copyAll() {
  const text = slides.map(s =>
    `[${s.num}/${slides.length}] ${s.title}\n${s.body}\n${s.tag || ''}`
  ).join('\n\n');
  navigator.clipboard.writeText(text).then(() => showToast('전체 텍스트 복사됐어요!'));
}

function copySlide() {
  const s = slides[selectedIdx];
  const text = `${s.title}\n${s.body}\n${s.tag || ''}`;
  navigator.clipboard.writeText(text).then(() => showToast(`${s.num}번 슬라이드 복사됐어요!`));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// API 키 로컬 저장
document.getElementById('apiKey').addEventListener('change', function() {
  localStorage.setItem('cnews_apikey', this.value);
});
window.addEventListener('load', function() {
  const saved = localStorage.getItem('cnews_apikey');
  if (saved) document.getElementById('apiKey').value = saved;
});
</script>
</body>
</html>
