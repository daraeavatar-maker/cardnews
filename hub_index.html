<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>다래 | 콘텐츠 도구</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0d0d0f;--surface:#17171a;--surface2:#1f1f24;
    --border:rgba(255,255,255,0.08);--text:#f0eff4;--sub:#8b8a96;--muted:#4a4955;
    --accent:#7c5cbf;--accent-l:rgba(124,92,191,0.12);--accent-b:rgba(124,92,191,0.35);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;min-height:100vh;display:flex;flex-direction:column;}
  .header{padding:48px 40px 0;}
  .logo{font-size:13px;color:var(--muted);letter-spacing:.05em;margin-bottom:32px;}
  .greeting{font-size:32px;font-weight:700;letter-spacing:-.03em;margin-bottom:8px;}
  .greeting-sub{font-size:15px;color:var(--sub);}
  .main{padding:40px;flex:1;}
  .section-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:16px;}
  .tools-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;}
  .tool-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:12px;transition:all .15s;cursor:pointer;}
  .tool-card:hover{border-color:var(--accent-b);background:var(--accent-l);}
  .tool-icon{font-size:28px;}
  .tool-name{font-size:15px;font-weight:600;}
  .tool-desc{font-size:13px;color:var(--sub);line-height:1.6;}
  .tool-tag{font-size:11px;color:var(--accent);background:var(--accent-l);border:1px solid var(--accent-b);border-radius:20px;padding:3px 10px;align-self:flex-start;}
  .coming{opacity:.4;pointer-events:none;}
  .footer{padding:24px 40px;font-size:12px;color:var(--muted);}
  @media(max-width:480px){
    .header{padding:32px 20px 0;}
    .main{padding:24px 20px;}
    .footer{padding:20px;}
    .greeting{font-size:24px;}
  }
</style>
</head>
<body>
<div class="header">
  <div class="logo">DARAEAVATAR-MAKER</div>
  <div class="greeting">안녕하세요 👋</div>
  <div class="greeting-sub">콘텐츠 제작 도구 모음입니다.</div>
</div>
<div class="main">
  <div class="section-label">도구</div>
  <div class="tools-grid">
    <a class="tool-card" href="https://daraeavatar-maker.github.io/cardnews">
      <div class="tool-icon">🌱</div>
      <div class="tool-name">카드뉴스 생성기</div>
      <div class="tool-desc">주제를 입력하면 인스타그램·블로그용 카드뉴스를 자동으로 생성하고 PNG로 다운로드해요.</div>
      <div class="tool-tag">AI 생성</div>
    </a>
    <div class="tool-card coming">
      <div class="tool-icon">✍️</div>
      <div class="tool-name">블로그 글 생성기</div>
      <div class="tool-desc">네이버 블로그 최적화 글을 자동으로 작성해요.</div>
      <div class="tool-tag">준비 중</div>
    </div>
    <div class="tool-card coming">
      <div class="tool-icon">📊</div>
      <div class="tool-name">콘텐츠 캘린더</div>
      <div class="tool-desc">계정별 업로드 일정을 관리해요.</div>
      <div class="tool-tag">준비 중</div>
    </div>
  </div>
</div>
<div class="footer">daraeavatar-maker.github.io</div>
</body>
</html>
